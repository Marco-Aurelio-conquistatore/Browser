plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nomedascegliere.browser'
    compileSdk 37

    defaultConfig {
        applicationId "com.nomedascegliere.browser"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    //kotlinOptions {
        //jvmTarget = '17'
    //}
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // GeckoView: ultima versione stabile
    implementation 'org.mozilla.geckoview:geckoview:158.0.20261007201254'
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.10'
    }
}